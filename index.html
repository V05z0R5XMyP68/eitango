<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ひろみの英単語フラッシュカード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh; min-height: 100dvh;
  background: linear-gradient(145deg, #0a0a1a 0%, #141432 40%, #1a1a3e 100%);
  color: #e8e6f0;
  font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Header */
.header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 16px; }
.header h1 {
  font-size: 20px; font-weight: 800; letter-spacing: 0.05em;
  background: linear-gradient(90deg, #7dd3fc, #c4b5fd, #f9a8d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header .subtitle { font-size: 12px; color: #8888aa; margin-top: 4px; }

/* Controls */
.controls {
  width: 100%; max-width: 480px;
  display: flex; gap: 8px; margin-bottom: 12px;
  flex-wrap: wrap; justify-content: center;
}
.pill {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid #333355; background: rgba(30,30,60,0.6);
  color: #8888aa; font-size: 13px; cursor: pointer;
  transition: all 0.2s; font-weight: 400; font-family: inherit;
}
.pill.active {
  border-color: #7dd3fc; background: rgba(125,211,252,0.15);
  color: #7dd3fc; font-weight: 700;
}
.settings-btn {
  padding: 6px 14px; border-radius: 20px;
  border: 1px dashed #555577; background: transparent;
  color: #8888aa; font-size: 13px; cursor: pointer; font-family: inherit;
}

/* Settings Panel */
.settings-panel {
  width: 100%; max-width: 480px;
  background: rgba(30,30,60,0.9); border: 1px solid rgba(125,211,252,0.15);
  border-radius: 16px; padding: 20px; margin-bottom: 16px;
  display: none;
}
.settings-panel.show { display: block; }
.settings-panel .hint { font-size: 13px; color: #aaaacc; margin-bottom: 10px; line-height: 1.6; }
.settings-panel code { color: #7dd3fc; }
.range-row {
  display: flex; gap: 8px; align-items: center;
  margin-top: 12px; flex-wrap: wrap;
}
.range-row span { font-size: 13px; color: #8888aa; }
.range-input {
  width: 70px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid #444466; background: #1a1a3e;
  color: #e8e6f0; font-size: 14px; text-align: center; font-family: inherit;
}
.range-btn {
  padding: 8px 18px; border-radius: 8px; border: none;
  background: linear-gradient(135deg, #7dd3fc, #60a5fa);
  color: #0a0a1a; font-weight: 700; font-size: 13px;
  cursor: pointer; font-family: inherit;
}
.csv-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }

/* Progress */
.progress-wrap { width: 100%; max-width: 480px; margin-bottom: 16px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: #8888aa; margin-bottom: 4px;
}
.progress-bar {
  width: 100%; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.06); overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
  transition: width 0.4s ease; width: 0%;
}

/* Card */
.card-container {
  width: 100%; max-width: 480px;
  perspective: 800px; margin-bottom: 20px;
}
.card {
  width: 100%; min-height: 220px; border-radius: 20px;
  cursor: pointer; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  width: 100%; min-height: 220px; border-radius: 20px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  backface-visibility: hidden;
  padding: 30px 20px;
}
.card-front {
  position: relative;
  background: linear-gradient(135deg, rgba(30,30,70,0.9), rgba(40,40,90,0.9));
  border: 1px solid rgba(125,211,252,0.15);
  box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
.card-back {
  position: absolute; top: 0; left: 0;
  transform: rotateY(180deg);
  background: linear-gradient(135deg, rgba(20,50,60,0.95), rgba(30,60,80,0.95));
  border: 1px solid rgba(125,211,252,0.15);
  box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
.card-label {
  font-size: 11px; color: #7dd3fc; letter-spacing: 0.12em;
  text-transform: uppercase; margin-bottom: 12px; font-weight: 600;
}
.card-text {
  font-size: 36px; font-weight: 700; text-align: center;
  line-height: 1.3; color: #f0f0ff; word-break: break-word;
}
.card-text.ja { font-size: 22px; font-weight: 700; }
.tap-hint { font-size: 11px; color: #666688; margin-top: 16px; }
.card-number { font-size: 10px; color: #555577; margin-top: 8px; }

/* Buttons */
.buttons { width: 100%; max-width: 480px; display: flex; gap: 12px; }
.btn {
  flex: 1; padding: 14px 0; border-radius: 14px; border: none;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; color: #fff; font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn-wrong {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  box-shadow: 0 4px 20px rgba(220,38,38,0.3);
}
.btn-correct {
  background: linear-gradient(135deg, #059669, #047857);
  box-shadow: 0 4px 20px rgba(5,150,105,0.3);
}

/* Summary */
.summary { width: 100%; max-width: 480px; text-align: center; display: none; }
.summary.show { display: block; }
.summary-label { font-size: 14px; color: #8888aa; margin-top: 20px; }
.summary-score {
  font-size: 56px; font-weight: 800;
  background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.summary-rate { font-size: 16px; color: #aaaacc; margin-top: 4px; }
.wrong-list {
  text-align: left; background: rgba(255,255,255,0.04);
  border-radius: 14px; padding: 16px 20px; margin-top: 16px;
  max-height: 300px; overflow-y: auto;
}
.wrong-list-title { font-size: 13px; color: #f87171; font-weight: 700; margin-bottom: 8px; }
.wrong-item {
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; display: flex; justify-content: space-between; gap: 12px;
}
.wrong-item:last-child { border-bottom: none; }
.wrong-item .en { color: #e8e6f0; white-space: nowrap; }
.wrong-item .ja { color: #8888aa; text-align: right; font-size: 12px; }
.summary-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.restart-btn {
  padding: 14px 24px; border-radius: 14px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  color: #fff; font-family: inherit;
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  box-shadow: 0 4px 20px rgba(124,58,237,0.3);
}
.restart-btn:active { transform: scale(0.97); }
.restart-btn.retry-wrong {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  box-shadow: 0 4px 20px rgba(220,38,38,0.3);
}

/* Study area */
.study-area { width: 100%; max-width: 480px; display: none; }
.study-area.show { display: block; }

/* Animations */
@keyframes slideOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(-60px); } }
@keyframes slideIn { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:translateX(0); } }
.slide-out .card-container { animation: slideOut 0.25s ease-out; }
.slide-in .card-container { animation: slideIn 0.3s ease-out; }

/* Footer */
.footer { margin-top: 40px; font-size: 11px; color: #444466; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <h1>ひろみの英単語フラッシュカード</h1>
  <p class="subtitle" id="subtitle">全1,495語</p>
</div>

<div class="controls">
  <button class="pill active" id="btnEn2Ja" onclick="setDirection('en2ja')">英→日</button>
  <button class="pill" id="btnJa2En" onclick="setDirection('ja2en')">日→英</button>
  <button class="settings-btn" onclick="toggleSettings()">⚙ 設定</button>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="hint">出題範囲を番号で指定できます（シス単の並び順）</div>
  <div class="range-row">
    <span>範囲：</span>
    <input class="range-input" type="number" id="rangeStart" value="1" min="1">
    <span style="color:#666">〜</span>
    <input class="range-input" type="number" id="rangeEnd" value="0" min="0" placeholder="全部">
    <span style="font-size:11px;color:#666688" id="rangeNote">(0=全1437語)</span>
  </div>
  <div style="margin-top:12px">
    <button class="range-btn" onclick="applyRange()">この範囲で開始</button>
  </div>
  <div class="filter-section" style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
    <div class="hint">累計の記録をもとに出題を絞り込めます</div>
    <div id="recordStats" style="font-size:12px;color:#8888aa;margin:8px 0"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="range-btn" onclick="startFromRecord('wrong')" id="btnFilterWrong" style="background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff">❌ わからないだけ</button>
      <button class="range-btn" onclick="startFromRecord('correct')" id="btnFilterCorrect" style="background:linear-gradient(135deg,#059669,#047857);color:#fff">✅ 覚えただけ</button>
      <button class="pill" onclick="resetRecord()" style="border-color:#f87171;color:#f87171;margin-top:4px">🗑 記録をリセット</button>
    </div>
  </div>
  <div class="csv-section">
    <div class="hint">別のCSVファイルで差し替えも可能：</div>
    <input type="file" accept=".csv,.tsv,.txt" onchange="handleFileImport(event)" style="font-size:13px;color:#e8e6f0">
  </div>
</div>

<div class="study-area show" id="studyArea">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressCount">1 / 100</span>
      <span id="progressScore">✅ 0　❌ 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  <div class="card-container" id="cardContainer">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-label" id="frontLabel">English</div>
        <div class="card-text" id="frontText">apple</div>
        <div class="tap-hint" id="tapHint">タップでめくる</div>
        <div class="card-number" id="cardNumber"></div>
      </div>
      <div class="card-face card-back">
        <div class="card-label" id="backLabel">日本語</div>
        <div class="card-text ja" id="backText">りんご</div>
      </div>
    </div>
  </div>
  <div class="buttons">
    <button class="btn btn-wrong" onclick="answer(false)">✗ わからない</button>
    <button class="btn btn-correct" onclick="answer(true)">✓ 覚えた！</button>
  </div>
</div>

<div class="summary" id="summary">
  <div class="summary-label">結果</div>
  <div class="summary-score" id="summaryScore">0 / 0</div>
  <div class="summary-rate" id="summaryRate">正答率 0%</div>
  <div class="wrong-list" id="wrongList" style="display:none">
    <div class="wrong-list-title" id="wrongListTitle">❌ 要復習</div>
    <div id="wrongItems"></div>
  </div>
  <div id="summaryRecordStats" style="font-size:12px;color:#666688;margin-top:16px"></div>
  <div class="summary-actions">
    <button class="restart-btn" onclick="startRound()">🔄 もう一度（全体）</button>
    <button class="restart-btn retry-wrong" id="retryWrongBtn" onclick="retryWrong()" style="display:none">🔁 間違えた語だけ復習</button>
  </div>
</div>

<div class="footer">
  ひろみの英単語データ（1,495語）内蔵<br>
  CSVで差し替えも可能
</div>

// ═══════ State ═══════
let words = BUILTIN_WORDS;
let deck = [];
let idx = 0;
let flipped = false;
let direction = "en2ja";
let results = [];
let rangeStart = 1;
let rangeEnd = 0;

// ═══════ Persistent Record (localStorage) ═══════
// record: { "idx": "correct"|"wrong" } keyed by word index in BUILTIN_WORDS
const RECORD_KEY = "flashcard_record";

function loadRecord() {
  try {
    const raw = localStorage.getItem(RECORD_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveRecord(rec) {
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(rec)); } catch(e) {}
}

function getRecordStats() {
  const rec = loadRecord();
  const keys = Object.keys(rec);
  const correctCount = keys.filter(k => rec[k] === "correct").length;
  const wrongCount = keys.filter(k => rec[k] === "wrong").length;
  return { total: keys.length, correct: correctCount, wrong: wrongCount };
}

function updateRecordStatsUI() {
  const stats = getRecordStats();
  const el = document.getElementById("recordStats");
  if (el) {
    if (stats.total === 0) {
      el.textContent = "まだ記録がありません（学習すると自動で記録されます）";
    } else {
      el.textContent = "記録: ✅ 覚えた " + stats.correct + "語 / ❌ わからない " + stats.wrong + "語 / 全" + words.length + "語中";
    }
  }
  // Disable buttons if no data
  const btnW = document.getElementById("btnFilterWrong");
  const btnC = document.getElementById("btnFilterCorrect");
  if (btnW) btnW.disabled = stats.wrong === 0;
  if (btnC) btnC.disabled = stats.correct === 0;
  if (btnW) btnW.style.opacity = stats.wrong === 0 ? "0.4" : "1";
  if (btnC) btnC.style.opacity = stats.correct === 0 ? "0.4" : "1";
}

function startFromRecord(filter) {
  const rec = loadRecord();
  const filtered = [];
  for (let i = 0; i < words.length; i++) {
    const key = String(i);
    if (filter === "wrong" && rec[key] === "wrong") filtered.push(words[i]);
    if (filter === "correct" && rec[key] === "correct") filtered.push(words[i]);
  }
  if (filtered.length === 0) {
    alert(filter === "wrong" ? "「わからない」の記録がありません" : "「覚えた」の記録がありません");
    return;
  }
  document.getElementById("settingsPanel").classList.remove("show");
  startRound(shuffle(filtered));
}

function resetRecord() {
  if (!confirm("累計の記録をすべてリセットしますか？")) return;
  localStorage.removeItem(RECORD_KEY);
  updateRecordStatsUI();
}

// ═══════ CSV Parser ═══════
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const result = [];
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    let parts;
    if (line.includes(",")) {
      // Simple CSV parse handling quoted fields
      const m = line.match(/^"?([^",]*)"?\s*,\s*"?([^"]*)"?/);
      if (m && m[1] && m[2]) {
        parts = [m[1].trim(), m[2].trim()];
      } else {
        parts = line.split(",").map(s => s.trim().replace(/^["']|["']$/g, ""));
      }
    } else if (line.includes("\t")) {
      parts = line.split("\t").map(s => s.trim());
    } else {
      parts = line.split(/\s+(.+)/);
    }
    if (parts && parts.length >= 2 && parts[0] && parts[1]) {
      const firstIsJa = /[\u3000-\u9fff\uff00-\uffef]/.test(parts[0]);
      result.push(firstIsJa ? {en:parts[1],ja:parts[0]} : {en:parts[0],ja:parts[1]});
    }
  }
  return result;
}

// ═══════ Shuffle ═══════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════ Helpers ═══════
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function updateRangeUI() {
  document.getElementById("rangeNote").textContent = "(0=全" + words.length + "語)";
}

// ═══════ Render ═══════
function renderCard() {
  const w = deck[idx];
  if (!w) return;
  const front = direction === "en2ja" ? w.en : w.ja;
  const back = direction === "en2ja" ? w.ja : w.en;
  const frontIsEn = direction === "en2ja";

  document.getElementById("frontLabel").textContent = frontIsEn ? "English" : "日本語";
  document.getElementById("backLabel").textContent = frontIsEn ? "日本語" : "English";
  document.getElementById("frontText").textContent = front;
  document.getElementById("backText").textContent = back;
  document.getElementById("frontText").className = "card-text" + (frontIsEn ? "" : " ja");
  document.getElementById("backText").className = "card-text" + (frontIsEn ? " ja" : "");
  document.getElementById("tapHint").style.display = flipped ? "none" : "block";

  // Show original index
  const origIdx = words.indexOf(w);
  document.getElementById("cardNumber").textContent = origIdx >= 0 ? "No." + (origIdx + 1) : "";

  document.getElementById("card").classList.toggle("flipped", flipped);

  const correct = results.filter(r => r.correct).length;
  const wrong = results.filter(r => !r.correct).length;
  document.getElementById("progressCount").textContent = (idx+1) + " / " + deck.length;
  document.getElementById("progressScore").textContent = "✅ " + correct + "　❌ " + wrong;
  document.getElementById("progressFill").style.width = ((idx+1)/deck.length*100) + "%";
}

// ═══════ Actions ═══════
function startRound(customDeck) {
  const s = Math.max(0, rangeStart - 1);
  const e = rangeEnd === 0 || rangeEnd > words.length ? words.length : rangeEnd;
  deck = customDeck || shuffle(words.slice(s, e));
  idx = 0;
  flipped = false;
  results = [];
  document.getElementById("studyArea").classList.add("show");
  document.getElementById("summary").classList.remove("show");
  renderCard();
}

function flipCard() {
  flipped = !flipped;
  renderCard();
}

function answer(correct) {
  results.push({ word: deck[idx], correct: correct });
  // Save to persistent record
  var wordIdx = words.indexOf(deck[idx]);
  if (wordIdx >= 0) {
    var rec = loadRecord();
    rec[String(wordIdx)] = correct ? "correct" : "wrong";
    saveRecord(rec);
  }
  if (idx + 1 < deck.length) {
    const container = document.getElementById("studyArea");
    container.classList.add("slide-out");
    setTimeout(function() {
      idx++;
      flipped = false;
      container.classList.remove("slide-out");
      container.classList.add("slide-in");
      renderCard();
      setTimeout(function() { container.classList.remove("slide-in"); }, 300);
    }, 250);
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById("studyArea").classList.remove("show");
  document.getElementById("summary").classList.add("show");

  const correct = results.filter(r => r.correct).length;
  const total = results.length;
  const wrongOnes = results.filter(r => !r.correct);

  document.getElementById("summaryScore").textContent = correct + " / " + total;
  document.getElementById("summaryRate").textContent = "正答率 " + (total > 0 ? Math.round(correct/total*100) : 0) + "%";

  if (wrongOnes.length > 0) {
    document.getElementById("wrongList").style.display = "block";
    document.getElementById("wrongListTitle").textContent = "❌ 要復習（" + wrongOnes.length + "語）";
    document.getElementById("wrongItems").innerHTML = wrongOnes.map(function(r) {
      return '<div class="wrong-item"><span class="en">' + esc(r.word.en) + '</span><span class="ja">' + esc(r.word.ja) + '</span></div>';
    }).join("");
    document.getElementById("retryWrongBtn").style.display = "inline-block";
  } else {
    document.getElementById("wrongList").style.display = "none";
    document.getElementById("retryWrongBtn").style.display = "none";
  }
  // Show cumulative record stats
  var cStats = getRecordStats();
  document.getElementById("summaryRecordStats").textContent = 
    "【累計記録】 ✅ " + cStats.correct + "語 / ❌ " + cStats.wrong + "語 / 全" + words.length + "語中";
}

function retryWrong() {
  var wrongWords = results.filter(function(r) { return !r.correct; }).map(function(r) { return r.word; });
  startRound(shuffle(wrongWords));
}

function setDirection(dir) {
  direction = dir;
  document.getElementById("btnEn2Ja").classList.toggle("active", dir === "en2ja");
  document.getElementById("btnJa2En").classList.toggle("active", dir === "ja2en");
  renderCard();
}

function toggleSettings() {
  document.getElementById("settingsPanel").classList.toggle("show");
  updateRecordStatsUI();
}

function applyRange() {
  rangeStart = parseInt(document.getElementById("rangeStart").value) || 1;
  rangeEnd = parseInt(document.getElementById("rangeEnd").value) || 0;
  document.getElementById("settingsPanel").classList.remove("show");
  startRound();
}

function handleFileImport(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var parsed = parseCSV(ev.target.result);
    if (parsed.length === 0) {
      alert("単語データが見つかりませんでした。CSV形式を確認してください。");
      return;
    }
    words = parsed;
    rangeStart = 1;
    rangeEnd = 0;
    document.getElementById("subtitle").textContent = file.name + " (" + parsed.length + "語)";
    document.getElementById("settingsPanel").classList.remove("show");
    updateRangeUI();
    startRound();
  };
  reader.readAsText(file);
}

// ═══════ Keyboard shortcuts ═══════
document.addEventListener("keydown", function(e) {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
  if (e.key === "ArrowLeft" || e.key === "1") { answer(false); }
  if (e.key === "ArrowRight" || e.key === "2") { answer(true); }
});

// ═══════ Init ═══════
updateRangeUI();
updateRecordStatsUI();
startRound();
